<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>ポケカ発見マップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css?v=03"><link rel="manifest" href="manifest.webmanifest"></head><body><header><div class="eyebrow">PRIVATE DISCOVERY LOG</div><h1>ポケカ発見マップ</h1><p>友達と共有するための発見記録・試作版</p></header><main><section id="mapView" class="view active"><div class="toolbar"><label>表示期間 <select id="period"><option value="all">すべて</option><option value="today">今日</option><option value="week">過去7日間</option></select></label><button id="locate">現在地へ</button></div><div id="map"></div><p class="hint">地図を長押しすると、その位置を登録できます。店舗の場所を確認してから保存してください。</p><div id="mapList"></div></section><section id="addView" class="view"><h2 id="formTitle">発見情報を登録</h2><form id="reportForm"><div class="searchbox"><strong>全国の店舗を探す</strong><label for="searchArea">① 地域（市区町村・駅名）</label><input id="searchArea" placeholder="例：宇都宮駅、渋谷駅、福岡市博多区"><label for="storeQuery">② 店舗名・チェーン名</label><div class="searchrow"><input id="storeQuery" type="search" placeholder="例：セブンイレブン"><button type="button" id="storeSearch">店舗検索</button></div><p class="hint">地域を中心とした約5km圏内の登録店舗を探します。結果はOpenStreetMapの情報です。</p><div id="storeResults" aria-live="polite"></div></div><label>店舗名<input id="shop" required maxlength="100" placeholder="例：○○店"></label><label>商品名<input id="product" required maxlength="120" placeholder="例：拡張パック"></label><label>発見日時<input id="foundAt" type="datetime-local" required></label><label>販売状況<select id="status"><option>販売を確認</option><option>在庫少なめ</option><option>売り切れ</option><option>不明</option></select></label><label>メモ<textarea id="memo" maxlength="1000" rows="3" placeholder="購入制限など"></textarea></label><div class="coords"><label>緯度<input id="lat" type="number" step="any" min="-90" max="90" required></label><label>経度<input id="lng" type="number" step="any" min="-180" max="180" required></label></div><p class="hint">検索結果を選ぶと座標が自動入力されます。地図の長押しや手入力も可能です。</p><button type="submit" class="primary">保存する</button><button type="button" id="cancelEdit" hidden>編集をキャンセル</button></form></section><section id="historyView" class="view"><h2>発見履歴</h2><div id="historyList"></div></section><section id="groupView" class="view"><h2>グループ共有</h2><div class="notice"><strong>次の開発段階で実装</strong><p>招待リンク、メンバー管理、リアルタイム同期を追加予定です。現在のデータはこのブラウザ内だけに保存され、友達には共有されません。</p></div><button id="export">記録をJSONで書き出す</button><label class="import">JSONから記録を読み込む<input type="file" id="import" accept="application/json,.json"></label></section></main><nav><button data-tab="map">🗺️<span>マップ</span></button><button data-tab="add">➕<span>登録</span></button><button data-tab="history">📅<span>履歴</span></button><button data-tab="group">👥<span>共有</span></button></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="app.js?v=03"></script></body></html>
