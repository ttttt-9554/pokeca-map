name: Famima collector verification
on:
  push:
    branches: [codex/sevennet-read-check-20261104]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Tokyo fetch and extraction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          import famima_lottery_enrich as f
          try:
              body=f.fetch('100163657179608640',os.environ['SUPABASE_URL'],os.environ['SUPABASE_SERVICE_ROLE_KEY'])
              row=f.extract(body)
              print('VERIFIED_RESULT:',row)
          except Exception as e:
              print('VERIFICATION_FAILED:',type(e).__name__)
          PY
