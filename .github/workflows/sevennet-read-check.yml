name: Sevennet read-only check
on:
  push:
    branches: [codex/sevennet-read-check-20261104]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the real extractor on the public page
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import sevennet_lottery_enrich as s
          url='https://7net.omni7.jp/detail/2190054281.html'
          try:
              result=s.extract(s.fetch(url))
              print('EXTRACTION:', result)
          except Exception as e:
              print('FETCH_FAILED:',type(e).__name__,str(e)[:200])
          PY
