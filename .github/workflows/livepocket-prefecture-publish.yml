name: LivePocket Verified Prefecture Backfill
'on':
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
permissions:
  contents: write
concurrency:
  group: livepocket-verified-prefecture-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests before any network access
        run: |
          python -m py_compile scripts/livepocket_v21.py scripts/livepocket_prefecture_backfill.py scripts/livepocket_prefecture_publish.py scripts/livepocket_prefecture_manual_snapshot.py
          PYTHONPATH=scripts python -m unittest scripts/test_livepocket_venue_prefecture.py scripts/test_livepocket_prefecture_backfill.py scripts/test_livepocket_prefecture_manual_snapshot.py scripts/test_livepocket_prefecture_publish.py scripts/test_livepocket_verified_store_merge.py
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Fetch current manual override exclusions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_prefecture_manual_snapshot.py
      - name: Check rotating batch of at most three events
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          OFFSET=$(( (RUN_NUMBER - 1) * 3 ))
          python scripts/livepocket_prefecture_backfill.py --apply --limit 3 --offset "$OFFSET" --manual-overrides-json prefecture_manual_overrides.json
      - name: Publish only newly verified non-conflicting CSV rows
        shell: bash
        run: |
          if [ ! -f prefecture_backfill_review/verified_changes.json ]; then
            echo "No verified changes to publish."
            exit 0
          fi
          python scripts/livepocket_prefecture_publish.py --manifest prefecture_backfill_review/verified_changes.json --manual-overrides-json prefecture_manual_overrides.json --write
          git add livepocket_verified_stores.csv
          if git diff --cached --quiet; then
            echo "No new verified CSV rows."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add exact-venue verified prefectures (max 3)'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent CSV edit detected; fail closed."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Verified CSV corrections published. Regular collector will update JSON."
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish safely."
          exit 1
      - name: Remove sensitive exclusions
        if: always()
        run: rm -f prefecture_manual_overrides.json
      - name: Upload verification manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefecture-verified-manifest
          path: prefecture_backfill_review/verified_changes.json
          if-no-files-found: ignore
          retention-days: 3
