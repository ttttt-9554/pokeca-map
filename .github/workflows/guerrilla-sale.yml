name: Guerrilla Sale Status Monitor

'on':
  workflow_dispatch:
  schedule:
    # At most once every 5 minutes; GitHub schedules may run late.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: read

concurrency:
  group: guerrilla-sale-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate sale monitor
        run: |
          python -m py_compile scripts/guerrilla_sale_monitor.py
          python -m unittest discover -s scripts -p 'test_guerrilla_sale_monitor.py'

      - name: Check official sale pages
        env:
          GUERRILLA_DISCORD_WEBHOOK_URL: ${{ secrets.GUERRILLA_DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: https://aypcmtlaaygmiexboypk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'Private monitor is not configured; skipping target checks.'
            exit 0
          fi
          python scripts/guerrilla_sale_monitor.py

