name: Guerrilla Sale Status Monitor

'on':
  workflow_dispatch:
  push:
    paths:
      - 'scripts/guerrilla_sale_monitor.py'
      - 'scripts/guerrilla_sale_probe.py'
      - 'scripts/test_guerrilla_sale_monitor.py'
      - 'guerrilla_sale_dev_v2.js'
      - 'sale_push_v1.js'
      - 'sw.js'
      - 'onsite_comment_alert_v21_55.js'
      - '.github/workflows/guerrilla-sale.yml'
  schedule:
    # Schedule delivery is best-effort, not an exact five-minute SLA.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: read

concurrency:
  group: guerrilla-sale-monitor
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate monitor and developer controls without network
        run: |
          python -m py_compile scripts/guerrilla_sale_monitor.py
          python -m unittest discover -s scripts -p 'test_guerrilla_sale_monitor.py' -v
          node --check guerrilla_sale_dev_v2.js
          node --check sale_push_v1.js
          node --check sw.js
          node --check onsite_comment_alert_v21_55.js

      - name: Read-only retailer smoke probe
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/guerrilla_sale_probe.py

  monitor:
    if: github.event_name != 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Private developer-only monitoring
        env:
          SUPABASE_URL: https://aypcmtlaaygmiexboypk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'Private database secret is not configured; no sites were monitored.'
            exit 0
          fi
          python scripts/guerrilla_sale_monitor.py
