name: LivePocket Missing Period Batch
'on':
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:
    inputs:
      offset:
        description: 'Skip this many eligible events before selecting the next batch'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  # Separate from the five-minute collector so its frequent runs cannot
  # replace this daily job while it is queued.
  group: livepocket-detail-period-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser and safe batch
        run: |
          python -m py_compile scripts/livepocket_detail_period_batch.py scripts/livepocket_v13.py scripts/livepocket_v21.py scripts/livepocket_detail_period_revalidate.py scripts/livepocket_prefecture_manual_snapshot.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_livepocket_detail_priority.py scripts/test_livepocket_detail_period_batch.py scripts/test_livepocket_detail_period_revalidate.py scripts/test_livepocket_prefecture_manual_snapshot.py
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Fetch manual exclusions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_prefecture_manual_snapshot.py
      - name: Verify at most five missing application periods
        env:
          OFFSET: ${{ inputs.offset }}
        run: |
          if [ -z "$OFFSET" ]; then OFFSET=0; fi
          if ! [[ "$OFFSET" =~ ^[0-9]{1,5}$ ]]; then
            echo "Invalid offset"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY_OF_YEAR=$(date -u +%-j)
            OFFSET=$(( (DAY_OF_YEAR - 1) * 5 ))
          fi
          PYTHONPATH=scripts python scripts/livepocket_detail_period_batch.py --manual-overrides-json prefecture_manual_overrides.json --limit 5 --offset "$OFFSET" --write
      - name: Refresh administrator exclusions and revalidate all changed events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/livepocket_prefecture_manual_snapshot.py
          python scripts/livepocket_detail_period_revalidate.py
      - name: Publish verified missing dates only
        shell: bash
        run: |
          git add livepocket_public.json livepocket_urls.json
          if git diff --cached --quiet; then
            echo "No verified missing dates to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill verified missing LivePocket application periods'
          # The five-minute collector may have published new catalog data
          # during this browser run. Never rebase an old full-JSON snapshot
          # over newer data; retry safely on the next scheduled run instead.
          BASE=$(git rev-parse HEAD^)
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo "Catalog changed during verification; skipping stale publication."
            exit 0
          fi
          git push origin HEAD:main
      - name: Remove private exclusions
        if: always()
        run: rm -f prefecture_manual_overrides.json
