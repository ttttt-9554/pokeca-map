name: LivePocket Missing Period Batch
'on':
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:
    inputs:
      offset:
        description: 'Skip this many eligible events before selecting the next batch'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  # Separate from the five-minute collector so its frequent runs cannot
  # replace this daily job while it is queued.
  group: livepocket-detail-period-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser and safe batch
        run: |
          python -m py_compile scripts/livepocket_detail_period_batch.py scripts/livepocket_v13.py scripts/livepocket_v21.py scripts/livepocket_detail_period_revalidate.py scripts/livepocket_detail_period_publish_latest.py scripts/livepocket_prefecture_manual_snapshot.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_livepocket_detail_priority.py scripts/test_livepocket_detail_period_batch.py scripts/test_livepocket_detail_period_revalidate.py scripts/test_livepocket_detail_period_publish_latest.py scripts/test_livepocket_detail_period_git_integration.py scripts/test_livepocket_prefecture_manual_snapshot.py
      - name: Fetch manual exclusions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_prefecture_manual_snapshot.py
      # Since 2026-10-26 12:25 JST, old lotteries are never rechecked.
      # This pure planning pass does not launch a browser or visit any event.
      - name: Plan checks for future announcements only
        id: periodplan
        run: |
          PYTHONPATH=scripts python scripts/livepocket_detail_period_batch.py --manual-overrides-json prefecture_manual_overrides.json --limit 5 --plan
      - name: Install browser only if new future event needs a check
        if: ${{ steps.periodplan.outputs.browser_needed == 'true' }}
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Verify at most five missing application periods
        env:
          OFFSET: ${{ inputs.offset }}
        run: |
          if [ -z "$OFFSET" ]; then OFFSET=0; fi
          if ! [[ "$OFFSET" =~ ^[0-9]{1,5}$ ]]; then
            echo "Invalid offset"
            exit 1
          fi
          # Scheduled checks always prioritize the newest eligible notices.
          # Manually supplied offsets remain available, but cannot revisit
          # announcements before the prospective-only cutover date.
          PYTHONPATH=scripts python scripts/livepocket_detail_period_batch.py --manual-overrides-json prefecture_manual_overrides.json --limit 5 --offset "$OFFSET" --write
      - name: Refresh administrator exclusions and revalidate all changed events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/livepocket_prefecture_manual_snapshot.py
          python scripts/livepocket_detail_period_revalidate.py
      - name: Capture validated exact-event deadline changes
        run: |
          python scripts/livepocket_detail_period_publish_latest.py capture --manifest "$RUNNER_TEMP/livepocket-deadline-verified.json"
      - name: Merge only verified dates into newest main and publish
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/livepocket-deadline-verified.json"
          for attempt in 1 2 3 4 5; do
            # Source files may advance every five minutes in the collector.
            # Reset an ephemeral checkout only; retain verified manifest in RUNNER_TEMP.
            git fetch origin main
            git reset --hard origin/main
            # Re-read administrator corrections on EVERY attempt before applying.
            python scripts/livepocket_prefecture_manual_snapshot.py
            python scripts/livepocket_detail_period_publish_latest.py apply \
              --manifest "$MANIFEST" \
              --manual-overrides-json prefecture_manual_overrides.json
            git add livepocket_public.json livepocket_urls.json
            if git diff --cached --quiet; then
              echo "No still-eligible verified application dates to publish."
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Backfill verified LivePocket application periods (latest catalog)'
            if git push origin HEAD:main; then
              echo "Only verified missing dates published to latest main."
              exit 0
            fi
            echo "Concurrent catalog update; safely retrying latest main ($attempt/5)."
            sleep 2
          done
          echo "Could not publish without a conflict after five safe retries."
          exit 1
      - name: Remove private exclusions
        if: always()
        run: rm -f prefecture_manual_overrides.json
