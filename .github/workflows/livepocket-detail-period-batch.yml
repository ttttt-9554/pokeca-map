name: LivePocket Missing Period Batch
'on':
  workflow_dispatch:
    inputs:
      offset:
        description: 'Skip this many eligible events before selecting the next batch'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: livepocket-collect
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser and safe batch
        run: |
          python -m py_compile scripts/livepocket_detail_period_batch.py scripts/livepocket_v13.py scripts/livepocket_v21.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_livepocket_detail_priority.py scripts/test_livepocket_detail_period_batch.py
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Fetch manual exclusions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_prefecture_manual_snapshot.py
      - name: Verify at most five missing application periods
        env:
          OFFSET: ${{ inputs.offset }}
        run: |
          if ! [[ "$OFFSET" =~ ^[0-9]{1,5}$ ]]; then
            echo "Invalid offset"
            exit 1
          fi
          PYTHONPATH=scripts python scripts/livepocket_detail_period_batch.py --manual-overrides-json prefecture_manual_overrides.json --limit 5 --offset "$OFFSET" --write
      - name: Publish verified missing dates only
        shell: bash
        run: |
          git add livepocket_public.json
          if git diff --cached --quiet; then
            echo "No verified missing dates to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill verified missing LivePocket application periods'
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Concurrent catalog change; fail closed."
            exit 1
          fi
          git push origin HEAD:main
      - name: Remove private exclusions
        if: always()
        run: rm -f prefecture_manual_overrides.json
