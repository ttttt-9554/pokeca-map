name: Discord Pre-Session Auth Hook Checks
'on':
  push:
    paths:
      - 'supabase/functions/discord-custom-access-token/**'
      - 'scripts/test_discord_custom_access_token.cjs'
      - 'DISCORD_PRESESSION_HOOK_SETUP.md'
      - '.github/workflows/discord-custom-access-token-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate policies and hook logic
        run: |
          node --check supabase/functions/discord-custom-access-token/policy.mjs
          node --check scripts/test_discord_custom_access_token.cjs
          node scripts/test_discord_custom_access_token.cjs
