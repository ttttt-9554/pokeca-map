name: LivePocket Venue Prefecture Smoke Test
'on':
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and unit tests
        run: |
          python -m py_compile scripts/livepocket_v21.py scripts/livepocket_venue_prefecture.py scripts/livepocket_prefecture_backfill.py scripts/livepocket_prefecture_manual_snapshot.py
          PYTHONPATH=scripts python -m unittest scripts/test_livepocket_venue_prefecture.py scripts/test_livepocket_prefecture_backfill.py scripts/test_livepocket_prefecture_manual_snapshot.py
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Load private Supabase manual override exclusions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_prefecture_manual_snapshot.py
      - name: Review rotating batch of three live events without publishing
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          OFFSET=$(( (RUN_NUMBER - 1) * 3 ))
          python scripts/livepocket_prefecture_backfill.py --apply --limit 3 --offset "$OFFSET" --manual-overrides-json prefecture_manual_overrides.json
      - name: Remove private exclusion snapshot
        if: always()
        run: rm -f prefecture_manual_overrides.json
      - name: Upload candidate data for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venue-prefecture-smoke-review
          path: prefecture_backfill_review/
          if-no-files-found: ignore
          retention-days: 3
