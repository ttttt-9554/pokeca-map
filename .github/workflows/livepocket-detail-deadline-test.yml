name: LivePocket Detail Deadline Regression
'on':
  push:
    branches: [main]
    paths:
      - app.js
      - scripts/test_app_manual_expiry.cjs
      - scripts/test_app_end_only_deadline.cjs
      - scripts/test_app_lottery_results_entries.cjs
      - scripts/test_private_lottery_accounts.cjs
      - scripts/test_private_account_unassigned.cjs
      - scripts/test_private_account_store.cjs
      - supabase/lottery_private_account_store_v21_102.sql
      - supabase/lottery_private_application_accounts_v21_100.sql
      - supabase/lottery_private_account_one_ticket_v21_101.sql
      - scripts/test_app_private_lottery_accounts.cjs
      - scripts/test_manual_lottery_registration.cjs
      - scripts/test_manual_lottery_dialog.cjs
      - scripts/test_store_analytics.cjs
      - store_analytics_v21_120.js
      - scripts/test_developer_unified_review.cjs
      - dev_unified_review_v21_124.js
      - supabase/lottery_private_application_accounts_v21_100.sql
      - index.html
      - style.css
      - scripts/test_app_manual_location.cjs
      - scripts/test_external_edit_discord.cjs
      - supabase/lottery_external_edit_discord_v21_115.sql
      - supabase/functions/discord-notify/index.ts
      - scripts/livepocket_v13.py
      - scripts/livepocket_v21.py
      - scripts/livepocket_v16.py
      - scripts/livepocket_v18.py
      - scripts/livepocket_future_policy.py
      - scripts/test_livepocket_future_policy.py
      - scripts/test_livepocket_detail_priority.py
      - scripts/livepocket_detail_period_batch.py
      - scripts/test_livepocket_detail_period_batch.py
      - scripts/livepocket_detail_period_publish_latest.py
      - scripts/test_livepocket_detail_period_publish_latest.py
      - scripts/test_livepocket_detail_period_git_integration.py
      - scripts/livepocket_detail_period_revalidate.py
      - scripts/test_livepocket_detail_period_revalidate.py
      - scripts/livepocket_prefecture_manual_snapshot.py
      - scripts/test_livepocket_prefecture_manual_snapshot.py
      - .github/workflows/livepocket-detail-period-batch.yml
      - .github/workflows/livepocket-collect.yml
      - .github/workflows/livepocket-detail-deadline-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run all deadline safety regressions
        run: |
          python -m py_compile scripts/livepocket_future_policy.py scripts/livepocket_v16.py scripts/livepocket_v18.py scripts/livepocket_v13.py scripts/livepocket_v21.py scripts/livepocket_detail_period_batch.py scripts/livepocket_detail_period_revalidate.py scripts/livepocket_detail_period_publish_latest.py scripts/livepocket_prefecture_manual_snapshot.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_livepocket_future_policy.py scripts/test_livepocket_detail_priority.py scripts/test_livepocket_detail_period_batch.py scripts/test_livepocket_detail_period_revalidate.py scripts/test_livepocket_detail_period_publish_latest.py scripts/test_livepocket_detail_period_git_integration.py scripts/test_livepocket_prefecture_manual_snapshot.py
      - name: Check PWA syntax and admin-corrected deadline expiry
        run: |
          node --check app.js
          node scripts/test_app_manual_expiry.cjs
          node scripts/test_app_end_only_deadline.cjs
          node scripts/test_app_lottery_results_entries.cjs
          node scripts/test_private_lottery_accounts.cjs
          node scripts/test_private_account_unassigned.cjs
          node scripts/test_private_account_store.cjs
          node scripts/test_app_private_lottery_accounts.cjs
          node scripts/test_manual_lottery_registration.cjs
          node scripts/test_manual_lottery_dialog.cjs
          node --check store_analytics_v21_120.js
          node scripts/test_store_analytics.cjs
          node --check dev_unified_review_v21_124.js
          node scripts/test_developer_unified_review.cjs
          node scripts/test_app_manual_location.cjs
          node scripts/test_external_edit_discord.cjs
