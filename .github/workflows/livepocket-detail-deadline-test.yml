name: LivePocket Detail Deadline Regression
'on':
  push:
    branches: [main]
    paths:
      - app.js
      - scripts/sevennet_lottery_enrich.py
      - scripts/test_sevennet_lottery_enrich.py
      - scripts/famima_lottery_enrich.py
      - scripts/test_famima_lottery_enrich.py
      - scripts/livepocket_period_trial.py
      - scripts/test_livepocket_period_trial.py
      - scripts/livepocket_event_schedule.py
      - scripts/test_livepocket_event_schedule.py
      - scripts/test_lottery_event_schedule.cjs
      - lottery_notifications_v1.js
      - supabase/lottery_result_announcement_parts_v1.sql
      - scripts/livepocket_individual_fetch.py
      - scripts/test_livepocket_individual_fetch.py
      - scripts/test_livepocket_immediate_dispatch_ui.cjs
      - scripts/test_lottery_public_poll.cjs
      - scripts/test_lottery_notification_scan.cjs
      - supabase/functions/discord-notify/lottery-scan-flow.mjs
      - supabase/livepocket_notification_fast_poll_v1.sql
      - supabase/livepocket_individual_fetch_v1.sql
      - supabase/livepocket_individual_dispatch_v1.sql
      - supabase/livepocket_individual_dispatch_v2.sql
      - supabase/famima_lottery_fetch_v1.sql
      - search_inputs_v1.js
      - info_plaza_sales_v1.js
      - admin_login_users_v1.js
      - scripts/test_admin_login_users.cjs
      - supabase/toreca_admin_logged_in_users_v1.sql
      - scripts/test_search_suggestions.cjs
      - scripts/test_lottery_product_resolution.cjs
      - scripts/test_app_manual_expiry.cjs
      - scripts/test_app_end_only_deadline.cjs
      - scripts/test_app_lottery_results_entries.cjs
      - scripts/test_header_login_navigation.cjs
      - scripts/test_refresh_tab_auth_restore.cjs
      - guide.html
      - scripts/test_private_lottery_accounts.cjs
      - scripts/test_private_account_unassigned.cjs
      - scripts/test_private_account_store.cjs
      - supabase/lottery_private_account_store_v21_102.sql
      - supabase/lottery_private_application_accounts_v21_100.sql
      - supabase/lottery_private_account_one_ticket_v21_101.sql
      - scripts/test_app_private_lottery_accounts.cjs
      - scripts/test_manual_lottery_registration.cjs
      - scripts/test_manual_lottery_multistore.cjs
      - scripts/test_manual_lottery_dialog.cjs
      - scripts/test_lottery_tracker_modal_layout.cjs
      - scripts/test_store_analytics.cjs
      - scripts/test_developer_unified_review.cjs
      - scripts/test_individual_fetch_ui.cjs
      - scripts/test_livepocket_individual_ui.cjs
      - scripts/test_livepocket_individual_queue_ui.cjs
      - scripts/test_individual_lottery_fetch.mjs
      - supabase/functions/lottery-individual-fetch/**
      - supabase/lottery_private_application_accounts_v21_100.sql
      - scripts/test_app_manual_location.cjs
      - scripts/test_external_edit_discord.cjs
      - scripts/test_external_multi_stores.cjs
      - supabase/lottery_external_multi_stores_v21_141.sql
      - supabase/lottery_external_edit_discord_v21_115.sql
      - supabase/functions/discord-notify/index.ts
      - scripts/livepocket_v13.py
      - scripts/livepocket_v21.py
      - scripts/livepocket_v16.py
      - scripts/livepocket_v18.py
      - scripts/livepocket_future_policy.py
      - scripts/test_livepocket_future_policy.py
      - scripts/test_livepocket_detail_priority.py
      - scripts/livepocket_detail_period_batch.py
      - scripts/test_livepocket_detail_period_batch.py
      - scripts/livepocket_detail_period_publish_latest.py
      - scripts/test_livepocket_detail_period_publish_latest.py
      - scripts/test_livepocket_detail_period_git_integration.py
      - scripts/livepocket_detail_period_revalidate.py
      - scripts/test_livepocket_detail_period_revalidate.py
      - scripts/livepocket_prefecture_manual_snapshot.py
      - scripts/test_livepocket_prefecture_manual_snapshot.py
      - .github/workflows/livepocket-detail-period-batch.yml
      - .github/workflows/livepocket-collect.yml
      - .github/workflows/livepocket-detail-deadline-test.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run all deadline safety regressions
        run: |
          PYTHONPATH=scripts python -m unittest -v scripts/test_sevennet_lottery_enrich.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_famima_lottery_enrich.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_livepocket_period_trial.py scripts/test_livepocket_individual_fetch.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_livepocket_event_schedule.py
          python -m py_compile scripts/livepocket_future_policy.py scripts/livepocket_v16.py scripts/livepocket_v18.py scripts/livepocket_v13.py scripts/livepocket_v21.py scripts/livepocket_detail_period_batch.py scripts/livepocket_detail_period_revalidate.py scripts/livepocket_detail_period_publish_latest.py scripts/livepocket_prefecture_manual_snapshot.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_livepocket_future_policy.py scripts/test_livepocket_detail_priority.py scripts/test_livepocket_detail_period_batch.py scripts/test_livepocket_detail_period_revalidate.py scripts/test_livepocket_detail_period_publish_latest.py scripts/test_livepocket_detail_period_git_integration.py scripts/test_livepocket_prefecture_manual_snapshot.py
      - name: Check PWA syntax and admin-corrected deadline expiry
        run: |
          node --check app.js
          node --check lottery_notifications_v1.js
          node scripts/test_lottery_event_schedule.cjs
          node --check search_inputs_v1.js
          node --check info_plaza_sales_v1.js
          node --check admin_login_users_v1.js
          node scripts/test_admin_login_users.cjs
          node scripts/test_search_suggestions.cjs
          node scripts/test_lottery_product_resolution.cjs
          node scripts/test_app_manual_expiry.cjs
          node scripts/test_app_end_only_deadline.cjs
          node scripts/test_app_lottery_results_entries.cjs
          node scripts/test_header_login_navigation.cjs
          node scripts/test_refresh_tab_auth_restore.cjs
          node scripts/test_private_lottery_accounts.cjs
          node scripts/test_private_account_unassigned.cjs
          node scripts/test_private_account_store.cjs
          node scripts/test_app_private_lottery_accounts.cjs
          node scripts/test_manual_lottery_registration.cjs
          node scripts/test_manual_lottery_multistore.cjs
          node scripts/test_manual_lottery_dialog.cjs
          node scripts/test_lottery_tracker_modal_layout.cjs
          node --check store_analytics_v21_120.js
          node scripts/test_store_analytics.cjs
          node --check dev_unified_review_v21_124.js
          node scripts/test_developer_unified_review.cjs
          node scripts/test_individual_fetch_ui.cjs
          node scripts/test_livepocket_individual_ui.cjs
          node scripts/test_livepocket_individual_queue_ui.cjs
          node scripts/test_livepocket_immediate_dispatch_ui.cjs
          node scripts/test_lottery_public_poll.cjs
          node scripts/test_lottery_notification_scan.cjs
          node scripts/test_individual_lottery_fetch.mjs
          node scripts/test_app_manual_location.cjs
          node scripts/test_external_edit_discord.cjs
          node scripts/test_external_multi_stores.cjs
      - name: Check individual queue access (read-only)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=scripts python -c "import livepocket_individual_fetch as q; result=q.rpc('livepocket_individual_peek_v1',{}); assert type(result) is int; print('Individual queue service connection OK')"
