
name: LivePocket Discord URL Collector

'on':
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Discord過去投稿も再確認する'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: livepocket-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Discord URLs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS || secrets.DISCORD_CHANNEL_ID }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        run: python scripts/livepocket_collect.py

      - name: Enrich product details from Discord (v5)
        run: python scripts/livepocket_discord_enrich.py

      - name: Apply verified event details (v4)
        run: python scripts/livepocket_merge_details.py

      - name: Enrich Discord embeds and optional search (v8)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          LIVEPOCKET_V8_DISCORD_MAX: '10'
          LIVEPOCKET_V8_BRAVE_PER_RUN: '3'
          LIVEPOCKET_V8_BRAVE_DAILY_MAX: '15'
        run: python scripts/livepocket_v8.py

      - name: Recover store names and create public JSON (v7)
        run: python scripts/livepocket_v7.py

      - name: Prefecture matching and review previews (v9)
        run: python scripts/livepocket_v9.py

      - name: Save JSON and review list to repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add livepocket_urls.json livepocket_public.json livepocket_review_queue.csv

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update LivePocket event data and review queue'
            git push
          fi

      - name: Backup full JSON for authorized maintainers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livepocket-urls-${{ github.run_number }}
          path: livepocket_urls.json
          retention-days: 7
