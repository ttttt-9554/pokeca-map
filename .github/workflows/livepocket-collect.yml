
name: LivePocket Discord URL Collector

'on':
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Discord過去投稿も再確認する'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']
      review_batch:
        description: '登録済みイベントを再確認する最大件数（開発者の手動ボタンは12）'
        required: false
        default: '8'
        type: choice
        options: ['8', '12']
  schedule:
    # 新しいDiscord投稿を約5分おきに確認。GitHubのschedule実行は遅延・欠落の可能性あり。
    # 毎時00分の集中を避けて02分から開始。
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    # 過去抽選の定時スキャンは停止。今後の新着と直近の再試行のみ。

permissions:
  contents: write

concurrency:
  group: livepocket-collect
  cancel-in-progress: false
  queue: max

jobs:
  # The existing authenticated dispatcher requests batch 12. Consume a
  # one-use server-side marker to distinguish an individual tap from a bulk
  # recheck, even if a scheduled collector already finished that exact URL.
  route:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.review_batch == '12' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      request_id: ${{ steps.route.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify individual or bulk request
        id: route
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_individual_fetch.py route

  individual:
    needs: route
    if: ${{ needs.route.result == 'success' && needs.route.outputs.mode == 'individual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Claim the requested event
        id: claim
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDIVIDUAL_REQUEST_ID: ${{ needs.route.outputs.request_id }}
        run: python scripts/livepocket_individual_fetch.py prepare-one
      - name: Install browser for the requested event
        id: individual_browser
        timeout-minutes: 2
        if: ${{ steps.claim.outputs.requested == 'true' }}
        continue-on-error: true
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Check the single event
        timeout-minutes: 2
        if: ${{ steps.claim.outputs.requested == 'true' }}
        continue-on-error: true
        run: python scripts/livepocket_individual_fetch.py execute
      - name: Save individual review result
        id: individual_complete
        if: ${{ always() && steps.claim.outputs.requested == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_individual_fetch.py complete
      - name: Check another queued event
        if: ${{ !cancelled() && steps.individual_browser.outcome == 'success' && steps.individual_complete.outcome == 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_individual_fetch.py execute-next
      - name: Preserve access cooldown if requested page is blocked
        if: ${{ always() && steps.claim.outputs.requested == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          git add livepocket_urls.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record LivePocket access cooldown'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

  collect:
    needs: route
    # No marker means a genuine bulk run. A failed router never falls through
    # to bulk work. Scheduled/default collection skips the router entirely.
    if: ${{ always() && !cancelled() && (needs.route.result == 'skipped' || (needs.route.result == 'success' && needs.route.outputs.mode == 'normal')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVEPOCKET_V14_SNAPSHOT: '.livepocket_v14_before.json'
      LIVEPOCKET_DEVELOPER_RECHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.review_batch == '12' && 'true' || 'false' }}
      LIVEPOCKET_V14_NEW_PER_RUN: '15'
      # 定期実行は schedule だけでなく外部からの workflow_dispatch でも起動する。
      # デフォルトの workflow_dispatch(8件/backfill=false)も新規抽選限定。
      # 開発者が12件の再確認または履歴補充を明示した場合のみ旧履歴を確認する。
      LIVEPOCKET_AUTO_FUTURE_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.review_batch == '12' || inputs.backfill == 'true') && 'false' || 'true' }}
      LIVEPOCKET_V14_BACKGROUND_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.review_batch == '12' && '12' || github.event_name == 'workflow_dispatch' && inputs.backfill == 'true' && '8' || '0' }}
      LIVEPOCKET_V16_RETRY_PER_RUN: '3'
      LIVEPOCKET_V14_RUN_BACKGROUND: ${{ github.event_name == 'workflow_dispatch' && (inputs.review_batch == '12' || inputs.backfill == 'true') && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # スナップショットは必ず収集の前。これが新着か否かの判定基準。
      - name: Snapshot existing URLs before Discord collection (v14)
        run: python scripts/livepocket_v14.py snapshot

      - name: Collect Discord URLs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS || secrets.DISCORD_CHANNEL_ID }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        run: python scripts/livepocket_collect.py

      # Other sites: independent metadata-only collection. LivePocket stays untouched.
      - name: Collect external non-X URLs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS || secrets.DISCORD_CHANNEL_ID }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        run: python scripts/collect_other_lottery.py

      - name: Read Sevennet lottery titles and application periods
        run: python scripts/sevennet_lottery_enrich.py

      - name: Read Cloud Pass lottery titles and application periods
        run: node scripts/cloud_pass_lottery_enrich.mjs

      - name: Read Famima lottery titles and reservation periods
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/famima_lottery_enrich.py

      - name: Enrich product details from Discord (v5)
        run: python scripts/livepocket_discord_enrich.py

      - name: Apply verified event details (v4)
        run: python scripts/livepocket_merge_details.py

      - name: Enrich Discord embeds without Brave (v8)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BRAVE_SEARCH_API_KEY: ''
          LIVEPOCKET_V8_DISCORD_MAX: '10'
          LIVEPOCKET_V8_BRAVE_PER_RUN: '0'
        run: python scripts/livepocket_v8.py

      - name: Recover store names and create public JSON (v7)
        run: python scripts/livepocket_v7.py

      - name: Prefecture matching and review previews (v9)
        run: python scripts/livepocket_v9.py

      - name: Verified updates and review classification (v10)
        run: python scripts/livepocket_v10.py

      - name: Confirm yearful application deadlines (v11)
        run: python scripts/livepocket_v11.py

      - name: Queue new URLs for immediate content checks (v14)
        id: priorities
        run: python scripts/livepocket_v14.py prepare

      # v18: 新着→6時間経過した新着の再確認→未確認の過去URL
      # v21.64: stop manual recheck regressions before planning browser work.
      - name: Test completed and retryable lottery review selection
        run: |
          python -m py_compile scripts/livepocket_v21.py scripts/livepocket_manual_completed.py scripts/livepocket_check_summary.py scripts/livepocket_venue_prefecture.py scripts/livepocket_master_prefecture.py scripts/livepocket_store_name_normalize.py scripts/livepocket_yellow_submarine.py
          PYTHONPATH=scripts python -m unittest scripts/test_livepocket_detail_priority.py
          python scripts/test_livepocket_manual_review.py
          PYTHONPATH=scripts python -m unittest scripts/test_livepocket_venue_prefecture.py scripts/test_livepocket_master_prefecture.py scripts/test_livepocket_yellow_submarine.py

      - name: Plan new, due retries and ticket products and verified store locations (v21)
        id: v21plan
        run: python scripts/livepocket_v21.py plan

      - name: Plan new CustomForm lotteries
        id: customform_plan
        run: python scripts/customform_lottery_enrich.py plan

      # Claim at most one administrator-requested event. No extra request is
      # made when the normal collector already visits the same event.
      - name: Prepare individual LivePocket review
        id: individual_prepare
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_individual_fetch.py prepare

      # 新着・再確認・個別要求がなければブラウザをインストールしない。
      - name: Install free browser only when needed
        if: ${{ steps.v21plan.outputs.browser_needed == 'true' || steps.individual_prepare.outputs.requested == 'true' || steps.customform_plan.outputs.browser_needed == 'true' }}
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium

      - name: Collect CustomForm lottery details
        if: ${{ steps.customform_plan.outputs.browser_needed == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/customform_lottery_enrich.py run

      - name: Check ticket products and multiple-store prefectures (v21)
        shell: bash
        env:
          LIVEPOCKET_V21_BROWSER_READY: ${{ steps.v21plan.outputs.browser_needed == 'true' || steps.individual_prepare.outputs.requested == 'true' }}
          LIVEPOCKET_INDIVIDUAL_ENABLED: ${{ steps.individual_prepare.outputs.requested }}
        run: |
          set -o pipefail
          cp livepocket_public.json "$RUNNER_TEMP/livepocket-public-before-process.json"
          python scripts/livepocket_v21.py process | tee "$RUNNER_TEMP/livepocket-v21-process.log"

      # Finalize even when browser installation or normal processing fails.
      - name: Save individual LivePocket review result
        if: ${{ always() && steps.individual_prepare.outputs.requested == 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_individual_fetch.py complete

      # v21.146: Add missing prefectures from uniquely identified store-master
      # labels, after official-page and manual-verified location extraction.
      # No fuzzy matches or overwrite of confirmed/admin-edited prefectures.
      # A temporary backend outage must not interrupt collecting new draws.
      - name: Fill missing LivePocket regions from verified store master
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/livepocket_master_prefecture.py --write
          python scripts/customform_lottery_enrich.py regions

      # 公開しても安全な集計数字のみ出力（URL・Discord本文・トークン等は含めない）。
      # Daily new-URL totals are refreshed on every collection run when changed;
      # manual recheck figures continue to be saved only for review_batch=12.
      - name: Build LivePocket developer results and daily additions (v21.18)
        env:
          REVIEW_BATCH: ${{ inputs.review_batch || '8' }}
        run: |
          python scripts/livepocket_check_summary.py \
            --log "$RUNNER_TEMP/livepocket-v21-process.log" \
            --output livepocket_check_summary.json \
            --before-public "$RUNNER_TEMP/livepocket-public-before-process.json" \
            --after-public livepocket_public.json

      - name: Save public data and check reports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add other_lottery_public.json livepocket_urls.json livepocket_public.json livepocket_review_queue.csv livepocket_deadline_review.csv livepocket_deadline_sources.csv livepocket_content_checks.csv
          if [ -f livepocket_check_summary.json ]; then
            git add livepocket_check_summary.json
          fi
          if [ -f livepocket_unresolved_review.json ]; then
            git add livepocket_unresolved_review.json
          fi
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update LivePocket v21 map catalog classification'
            # The developer may push app/source changes while this 5-minute
            # collector is running. Rebase our data-only commit on the latest
            # main instead of losing the collected URLs to a rejected push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Generated lottery files conflict with newer changes; preserving previous published data.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Lottery catalog published successfully.'
                exit 0
              fi
              echo "Remote advanced during push (attempt $attempt/3); retrying..."
              sleep 2
            done
            echo 'Collector could not publish after three safe retries.'
            exit 1
          fi

      - name: Backup full JSON for authorized maintainers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livepocket-urls-${{ github.run_number }}
          path: livepocket_urls.json
          retention-days: 7
