name: Verified LivePocket Store Merge Tests
'on':
  push:
    branches: [main]
    paths:
      - scripts/livepocket_v19.py
      - scripts/test_livepocket_verified_store_merge.py
      - scripts/livepocket_prefecture_backfill.py
      - scripts/livepocket_prefecture_manual_snapshot.py
      - scripts/test_livepocket_prefecture_backfill.py
      - scripts/test_livepocket_prefecture_manual_snapshot.py
      - scripts/livepocket_master_prefecture.py
      - scripts/livepocket_store_name_normalize.py
      - scripts/livepocket_yellow_submarine.py
      - scripts/test_livepocket_yellow_submarine.py
      - yellow_submarine_stores.json
      - scripts/test_livepocket_master_prefecture.py
      - scripts/livepocket_prefecture_publish.py
      - scripts/test_livepocket_prefecture_publish.py
      - .github/workflows/test-livepocket-store-merge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax
        run: python -m py_compile scripts/livepocket_v19.py scripts/test_livepocket_verified_store_merge.py scripts/livepocket_prefecture_backfill.py scripts/livepocket_prefecture_manual_snapshot.py scripts/livepocket_prefecture_publish.py scripts/livepocket_master_prefecture.py scripts/test_livepocket_master_prefecture.py scripts/livepocket_store_name_normalize.py scripts/livepocket_yellow_submarine.py scripts/test_livepocket_yellow_submarine.py
      - name: Test verified prefecture merge
        run: PYTHONPATH=scripts python -m unittest scripts/test_livepocket_verified_store_merge.py scripts/test_livepocket_prefecture_backfill.py scripts/test_livepocket_prefecture_manual_snapshot.py scripts/test_livepocket_prefecture_publish.py scripts/test_livepocket_master_prefecture.py scripts/test_livepocket_yellow_submarine.py
