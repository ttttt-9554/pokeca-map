name: LivePocket Open Lottery Prefecture Sweep
'on':
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: livepocket-verified-prefecture-publish
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax and regression tests
        run: |
          python -m py_compile scripts/livepocket_prefecture_sweep.py scripts/livepocket_prefecture_publish.py
          PYTHONPATH=scripts python -m unittest scripts/test_livepocket_prefecture_sweep.py scripts/test_livepocket_prefecture_publish.py scripts/test_livepocket_prefecture_backfill.py scripts/test_livepocket_venue_prefecture.py
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Read Supabase manual corrections
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_prefecture_manual_snapshot.py
      - name: Check all eligible active single-store lotteries (maximum 100)
        run: python scripts/livepocket_prefecture_sweep.py --manual-overrides-json prefecture_manual_overrides.json --max-events 100
      - name: Refresh manual exclusions before publishing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/livepocket_prefecture_manual_snapshot.py
      - name: Add verified regions to durable CSV only
        shell: bash
        run: |
          python scripts/livepocket_prefecture_publish.py --manifest prefecture_backfill_review/verified_changes.json --manual-overrides-json prefecture_manual_overrides.json --max-changes 100 --write
          git add livepocket_verified_stores.csv
          if git diff --cached --quiet; then
            echo "No new verified corrections."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill verified active LivePocket venue regions'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent changes require manual reconciliation."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Verified regions saved; ordinary collector will update public JSON."
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Remove sensitive manual exclusion snapshot
        if: always()
        run: rm -f prefecture_manual_overrides.json
      - name: Upload minimal verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-lottery-prefecture-review
          path: prefecture_backfill_review/verified_changes.json
          if-no-files-found: ignore
          retention-days: 3
