name: LivePocket prefecture backfill tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/livepocket-prefecture-backfill-20261025
  pull_request:
    paths:
      - 'scripts/livepocket_venue_prefecture.py'
      - 'scripts/livepocket_prefecture_backfill.py'
      - 'scripts/test_livepocket_*prefecture*.py'
      - '.github/workflows/test-prefecture-backfill.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: python -m py_compile scripts/livepocket_v21.py scripts/livepocket_venue_prefecture.py scripts/livepocket_prefecture_backfill.py scripts/livepocket_prefecture_manual_snapshot.py
      - name: Isolated unit tests
        run: |
          PYTHONPATH=scripts python -m unittest scripts/test_livepocket_venue_prefecture.py scripts/test_livepocket_prefecture_backfill.py scripts/test_livepocket_prefecture_manual_snapshot.py
      - name: Dry run without writing
        run: python scripts/livepocket_prefecture_backfill.py --limit 8
      - name: Install browser for exact-URL smoke test
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Fetch up to 3 live venue pages without publishing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/livepocket_prefecture_backfill.py --apply --limit 3
      - name: Upload review-only candidate data
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: venue-backfill-review
          path: prefecture_backfill_review/
          if-no-files-found: ignore
          retention-days: 3
